<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Wandered Off | Cuddle Cub</title>
  <meta name="description" content="Oops! This page took a little nap or wandered off the nursery trail. Explore our organic baby clothing collections, size guides, and newborn essentials.">
  <link rel="icon" type="image/png" href="cuddle-cub-light-logo-hd.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="404.css">
</head>
<body class="error-page-body">

  <div class="error-404-screen">
    <div class="error-404-ambient-glow"></div>

    <div class="error-404-corner-controls">
      <button class="theme-icon-btn dir-toggle-btn" id="dir-toggle-btn" aria-label="Toggle Page Direction" title="Toggle Page Direction (LTR / RTL)">
        <i data-lucide="arrow-left-right" class="fas fa-right-left"></i>
      </button>

      <button class="theme-icon-btn theme-toggle-btn" aria-label="Toggle Dark and Light theme" title="Toggle Theme">
        <i data-lucide="moon" class="fas fa-moon theme-icon"></i>
      </button>
    </div>

    <main class="error-404-center-card">

      <a href="index.html" class="error-center-brand" aria-label="Cuddle Cub Home">
        <div class="error-center-logo-wrap">
          <img src="cuddle-cub-light-logo-hd.png" class="brand-logo-light" alt="Cuddle Cub Logo" width="72" height="72" />
          <img src="cuddle-cub-dark-logo-hd.png" class="brand-logo-dark" alt="Cuddle Cub Logo" width="72" height="72" />
        </div>
        <div class="error-center-brand-info">
          <span class="error-center-brand-name">Cuddle<span>Cub</span></span>
          <span class="error-center-brand-tagline">"Cute. Comfy. Chic"</span>
        </div>
      </a>

      <div class="error-404-visual-wrap">
        <span class="error-404-digit">4</span>
        <div class="error-404-mascot-box" id="errorMascotBox" role="button" aria-label="Tap the cub mascot" tabindex="0">
          <i data-lucide="footprints" class="fas fa-paw error-404-mascot-icon"></i>
          <div class="error-404-floating-paw">
            <i data-lucide="heart" class="fas fa-heart"></i>
          </div>
        </div>
        <span class="error-404-digit">4</span>
      </div>

      <span class="error-404-badge">
        <i data-lucide="compass" class="fas fa-compass"></i> Lost in the Nursery Woods
      </span>

      <h1 class="error-404-title">Our Little Cub Wandered Off</h1>
      
      <p class="error-404-subtitle">
        Even the most curious little cubs take an unexpected turn during playtime! This page took a peaceful nap, but our warm organic nursery collections are waiting for you.
      </p>

      <div class="error-404-btn-wrap">
        <a href="index.html" class="btn btn-primary error-404-home-btn-large">
          <i data-lucide="home" class="fas fa-house"></i>
          <span>Back to Home</span>
        </a>
      </div>

    </main>
  </div>

  <script src="main.js"></script>
  <script src="404.js"></script>
</body>
</html>
